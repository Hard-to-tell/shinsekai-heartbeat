name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RachelForster/Shinsekai
          ref: 4125f513e2372898cc51b5da81135f2d359d0f87
          path: .shinsekai-host
          sparse-checkout: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke_host_sdk.py .shinsekai-host
